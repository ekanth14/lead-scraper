<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="zienGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D07A" />
    </linearGradient>
    <linearGradient id="orvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="hotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5370" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowZien" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowHot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="150" y1="0" x2="150" y2="440" />
    <line x1="300" y1="0" x2="300" y2="440" />
    <line x1="450" y1="0" x2="450" y2="440" />
    <line x1="600" y1="0" x2="600" y2="440" />
    <line x1="750" y1="0" x2="750" y2="440" />
    <line x1="900" y1="0" x2="900" y2="440" />
    <line x1="1050" y1="0" x2="1050" y2="440" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="120" r="140" fill="#06B6D4" opacity="0.12" filter="url(#glowZien)" />
  <circle cx="1050" cy="180" r="160" fill="#818CF8" opacity="0.1" filter="url(#glowZien)" />
  <circle cx="600" cy="380" r="120" fill="#22D07A" opacity="0.08" filter="url(#glowZien)" />

  <!-- Top Status Badge -->
  <g transform="translate(60, 48)">
    <rect width="280" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#22D07A">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" fill="#94A3B8" class="mono" font-size="11" font-weight="600">DUAL-BRAND AI PIPELINE · LIVE</text>
  </g>

  <!-- Brand Badges (Top Right) -->
  <g transform="translate(860, 48)">
    <rect width="130" height="30" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="65" y="19" fill="#A5B4FC" class="body" font-size="12" font-weight="700" text-anchor="middle">⚡ ORVYQMEDIA</text>
  </g>
  <g transform="translate(1005, 48)">
    <rect width="135" height="30" rx="8" fill="#062E38" stroke="#06B6D4" stroke-width="1" />
    <text x="67" y="19" fill="#67E8F9" class="body" font-size="12" font-weight="700" text-anchor="middle">💎 ZIEN TECH</text>
  </g>

  <!-- Main Title & Subtitle -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="#F8FAFC" class="title" font-size="44" letter-spacing="-1">
      Lead Scraper <tspan fill="url(#zienGrad)">AI</tspan>
    </text>
    <text x="0" y="38" fill="#94A3B8" class="body" font-size="16">
      Precision B2B lead generation with Places API (New), automated 99-pt qualification scoring,
    </text>
    <text x="0" y="62" fill="#94A3B8" class="body" font-size="16">
      high-conversion <tspan fill="#FF5370" font-weight="700">"No Website"</tspan> signal detection, and instant Claude AI outreach.
    </text>
  </g>

  <!-- 4 Feature Cards at Bottom -->
  <!-- Card 1: Places API New -->
  <g transform="translate(60, 240)">
    <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect width="36" height="36" rx="8" x="18" y="18" fill="#062E38" stroke="#06B6D4" stroke-width="1" />
    <text x="36" y="42" fill="#22D07A" class="title" font-size="18" text-anchor="middle">📍</text>
    <text x="18" y="80" fill="#F1F5F9" class="title" font-size="15">Places API (New)</text>
    <text x="18" y="104" fill="#94A3B8" class="body" font-size="12">Single-call searchText endpoint</text>
    <text x="18" y="124" fill="#64748B" class="mono" font-size="11">Zero separate Details fees</text>
    <rect x="180" y="18" width="52" height="20" rx="10" fill="#22D07A" fill-opacity="0.15" />
    <text x="206" y="32" fill="#22D07A" class="mono" font-size="10" font-weight="700" text-anchor="middle">v1</text>
  </g>

  <!-- Card 2: 99-Point Scoring -->
  <g transform="translate(330, 240)">
    <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect width="36" height="36" rx="8" x="18" y="18" fill="#450A0A" stroke="#EF4444" stroke-width="1" />
    <text x="36" y="42" fill="#F87171" class="title" font-size="18" text-anchor="middle">🔥</text>
    <text x="18" y="80" fill="#F1F5F9" class="title" font-size="15">99-Point Scoring</text>
    <text x="18" y="104" fill="#94A3B8" class="body" font-size="12">Base 40 + website signals</text>
    <text x="18" y="124" fill="#F59E0B" class="mono" font-size="11">Hot (≥70) · Warm · Cold</text>
    <rect x="180" y="18" width="52" height="20" rx="10" fill="#EF4444" fill-opacity="0.15" />
    <text x="206" y="32" fill="#F87171" class="mono" font-size="10" font-weight="700" text-anchor="middle">HOT</text>
  </g>

  <!-- Card 3: Free-Tier Guard -->
  <g transform="translate(600, 240)">
    <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect width="36" height="36" rx="8" x="18" y="18" fill="#1E1B4B" stroke="#6366F1" stroke-width="1" />
    <text x="36" y="42" fill="#A5B4FC" class="title" font-size="18" text-anchor="middle">🛡️</text>
    <text x="18" y="80" fill="#F1F5F9" class="title" font-size="15">Free-Tier Guard</text>
    <text x="18" y="104" fill="#94A3B8" class="body" font-size="12">Atomic Supabase usage table</text>
    <text x="18" y="124" fill="#22D07A" class="mono" font-size="11">Strict 900 calls/mo cap</text>
    <rect x="160" y="18" width="72" height="20" rx="10" fill="#6366F1" fill-opacity="0.15" />
    <text x="196" y="32" fill="#A5B4FC" class="mono" font-size="10" font-weight="700" text-anchor="middle">SAFETY</text>
  </g>

  <!-- Card 4: AI Outreach -->
  <g transform="translate(870, 240)">
    <rect width="270" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <rect width="36" height="36" rx="8" x="18" y="18" fill="#311042" stroke="#C084FC" stroke-width="1" />
    <text x="36" y="42" fill="#E879F9" class="title" font-size="18" text-anchor="middle">🤖</text>
    <text x="18" y="80" fill="#F1F5F9" class="title" font-size="15">Claude AI Outreach</text>
    <text x="18" y="104" fill="#94A3B8" class="body" font-size="12">One-click bespoke DM pitch</text>
    <text x="18" y="124" fill="#C084FC" class="mono" font-size="11">Tailored by brand &amp; niche</text>
    <rect x="180" y="18" width="72" height="20" rx="10" fill="#C084FC" fill-opacity="0.15" />
    <text x="216" y="32" fill="#E879F9" class="mono" font-size="10" font-weight="700" text-anchor="middle">CLAUDE</text>
  </g>
</svg>
