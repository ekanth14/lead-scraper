<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="hotPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="warmPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="coldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="520" rx="14" fill="url(#flowBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Flowchart Title -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#F8FAFC" class="sans" font-size="22" font-weight="800">
      AUTOMATED 99-POINT QUALIFICATION SCORING ENGINE
    </text>
    <text x="0" y="24" fill="#94A3B8" class="sans" font-size="13">
      Deterministic lead prioritization algorithm tailored for Orvyqmedia &amp; Zien Technologies
    </text>
  </g>

  <!-- ── STEP 1: BASE ──────────────────────────────────── -->
  <g transform="translate(50, 95)">
    <rect width="160" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="30" fill="#94A3B8" class="sans" font-size="11" font-weight="700" text-anchor="middle">STEP 1</text>
    <text x="80" y="55" fill="#38BDF8" class="sans" font-size="16" font-weight="800" text-anchor="middle">Base Score</text>
    <text x="80" y="74" fill="#22D07A" class="mono" font-size="13" font-weight="700" text-anchor="middle">+40 PTS</text>
  </g>

  <path d="M 210 140 L 260 140" stroke="#38BDF8" stroke-width="2" fill="none" />

  <!-- ── STEP 2: WEBSITE CLASSIFIER ────────────────────── -->
  <g transform="translate(260, 95)">
    <rect width="210" height="175" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
    <text x="105" y="26" fill="#94A3B8" class="sans" font-size="11" font-weight="700" text-anchor="middle">STEP 2: WEBSITE SIGNAL</text>
    
    <!-- None -->
    <rect x="12" y="38" width="186" height="38" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="0.8" />
    <text x="22" y="56" fill="#FCA5A5" class="sans" font-size="11" font-weight="700">🔴 website_status = "none"</text>
    <text x="22" y="70" fill="#EF4444" class="mono" font-size="11" font-weight="800">+30 PTS (High Intent)</text>

    <!-- Social Only -->
    <rect x="12" y="82" width="186" height="38" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="0.8" />
    <text x="22" y="100" fill="#FDE68A" class="sans" font-size="11" font-weight="700">📱 "social_only" (Linktree/IG)</text>
    <text x="22" y="114" fill="#F59E0B" class="mono" font-size="11" font-weight="800">+25 PTS (Needs Website)</text>

    <!-- Has Website -->
    <rect x="12" y="126" width="186" height="38" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
    <text x="22" y="144" fill="#A7F3D0" class="sans" font-size="11" font-weight="700">✅ "has_website" (Custom)</text>
    <text x="22" y="158" fill="#10B981" class="mono" font-size="11" font-weight="800">+0 PTS</text>
  </g>

  <path d="M 470 140 L 520 140" stroke="#38BDF8" stroke-width="2" fill="none" />

  <!-- ── STEP 3: REPUTATION & REVIEWS ──────────────────── -->
  <g transform="translate(520, 95)">
    <rect width="210" height="175" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
    <text x="105" y="26" fill="#94A3B8" class="sans" font-size="11" font-weight="700" text-anchor="middle">STEP 3: REPUTATION GAP</text>

    <!-- Rating < 4.0 -->
    <rect x="12" y="38" width="186" height="58" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="22" y="58" fill="#E2E8F0" class="sans" font-size="12" font-weight="700">Google Rating &lt; 4.0</text>
    <text x="22" y="74" fill="#94A3B8" class="sans" font-size="10">Needs reputation / rebranding</text>
    <text x="22" y="88" fill="#22D07A" class="mono" font-size="11" font-weight="800">+10 PTS</text>

    <!-- Reviews < 50 -->
    <rect x="12" y="104" width="186" height="58" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="22" y="124" fill="#E2E8F0" class="sans" font-size="12" font-weight="700">Reviews &lt; 50 or New</text>
    <text x="22" y="140" fill="#94A3B8" class="sans" font-size="10">Under-represented online</text>
    <text x="22" y="154" fill="#22D07A" class="mono" font-size="11" font-weight="800">+10 PTS</text>
  </g>

  <path d="M 730 140 L 780 140" stroke="#38BDF8" stroke-width="2" fill="none" />

  <!-- ── STEP 4: NICHE BONUS ───────────────────────────── -->
  <g transform="translate(780, 95)">
    <rect width="170" height="175" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" />
    <text x="85" y="26" fill="#06B6D4" class="sans" font-size="11" font-weight="700" text-anchor="middle">STEP 4: BRAND MATCH</text>

    <g transform="translate(10, 42)">
      <rect width="150" height="120" rx="6" fill="#062E38" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="22" fill="#67E8F9" class="sans" font-size="11" font-weight="800">ZIEN HIGH-TICKET:</text>
      <text x="12" y="42" fill="#E2E8F0" class="sans" font-size="10">• Architect</text>
      <text x="12" y="58" fill="#E2E8F0" class="sans" font-size="10">• Interior Design</text>
      <text x="12" y="74" fill="#E2E8F0" class="sans" font-size="10">• Real Estate Builder</text>
      <text x="12" y="90" fill="#E2E8F0" class="sans" font-size="10">• Construction</text>
      <text x="12" y="110" fill="#22D07A" class="mono" font-size="12" font-weight="800">+10 PTS BONUS</text>
    </g>
  </g>

  <!-- ── STEP 5: FINAL SCORING GAUGE & LABELS ───────────── -->
  <g transform="translate(50, 310)">
    <rect width="900" height="170" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    
    <text x="24" y="32" fill="#F8FAFC" class="sans" font-size="14" font-weight="800">
      FINAL QUALIFICATION (Capped at 99 Points)
    </text>
    <text x="320" y="32" fill="#64748B" class="mono" font-size="11">
      score = min(40 + web + rating + reviews + niche, 99)
    </text>

    <!-- Hot Card -->
    <g transform="translate(24, 52)">
      <rect width="270" height="96" rx="8" fill="#450A0A" stroke="#EF4444" stroke-width="1.5" />
      <text x="16" y="28" fill="#F87171" class="sans" font-size="14" font-weight="800">🔥 HOT LEAD</text>
      <text x="220" y="28" fill="#FFFFFF" class="mono" font-size="14" font-weight="800">≥ 70</text>
      <text x="16" y="52" fill="#FCA5A5" class="sans" font-size="11">High conversion probability</text>
      <text x="16" y="70" fill="#FCA5A5" class="sans" font-size="11">No website + local niche presence</text>
      <text x="16" y="86" fill="#EF4444" class="sans" font-size="10" font-weight="700">Action: Priority Personalized Outreach</text>
    </g>

    <!-- Warm Card -->
    <g transform="translate(314, 52)">
      <rect width="270" height="96" rx="8" fill="#451A03" stroke="#F59E0B" stroke-width="1.5" />
      <text x="16" y="28" fill="#FBBF24" class="sans" font-size="14" font-weight="800">🟡 WARM LEAD</text>
      <text x="210" y="28" fill="#FFFFFF" class="mono" font-size="14" font-weight="800">45 – 69</text>
      <text x="16" y="52" fill="#FDE68A" class="sans" font-size="11">Moderate conversion probability</text>
      <text x="16" y="70" fill="#FDE68A" class="sans" font-size="11">Social-only or low review count</text>
      <text x="16" y="86" fill="#F59E0B" class="sans" font-size="10" font-weight="700">Action: Rebranding / Automation Pitch</text>
    </g>

    <!-- Cold Card -->
    <g transform="translate(604, 52)">
      <rect width="270" height="96" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <text x="16" y="28" fill="#94A3B8" class="sans" font-size="14" font-weight="800">⚪ COLD LEAD</text>
      <text x="220" y="28" fill="#FFFFFF" class="mono" font-size="14" font-weight="800">&lt; 45</text>
      <text x="16" y="52" fill="#CBD5E1" class="sans" font-size="11">Established web presence</text>
      <text x="16" y="70" fill="#CBD5E1" class="sans" font-size="11">High review count + existing website</text>
      <text x="16" y="86" fill="#94A3B8" class="sans" font-size="10" font-weight="700">Action: Secondary Nurturing</text>
    </g>
  </g>
</svg>
